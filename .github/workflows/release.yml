# Выпуск целиком по метке.
#
#     git tag v0.1.2 && git push origin v0.1.2
#
# Дальше всё делается само: номер берётся из метки и разносится по файлам,
# пакет уходит в npm с отметкой о происхождении, появляется релиз GitHub с
# архивом, а версия возвращается в main —
# иначе плагин Claude Code показывал бы старый номер.
#
# Номер в package.json править руками не нужно: источник правды — метка.
#
# Секретов не требуется: право публиковать в npm выдаётся по OIDC через
# «Trusted Publisher», настроенный на странице пакета.

name: Выпуск

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # релиз и возврат версии в main
  id-token: write # отметка о происхождении пакета в npm

jobs:
  release:
    name: npm и релиз
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Номер версии из метки
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Сборка выполняется скриптом prepare внутри npm ci.
      - run: npm ci

      # npm version правит и package.json, и файл замка, а скрипт version
      # разносит номер по плагину.
      - name: Проставить версию во все файлы выпуска
        run: npm version "${{ steps.version.outputs.value }}" --no-git-tag-version --allow-same-version

      - name: Проверка типов
        run: npm run typecheck

      # Пересобираем после смены версии: она попадает в вывод --version.
      #
      # Проверяем оба выпускаемых файла. `dist/index.js` — вывод tsc, он
      # уходит в npm; `plugins/operbots-mcp/dist/index.js` — сборка
      # esbuild, и именно её запускает Claude Code. Раньше вторую не
      # поднимали ни разу: сломанная сборка плагина доезжала до людей.
      #
      # И не просто `--version`: сервер должен ответить на рукопожатие по
      # stdio и перечислить инструменты — иначе клиент увидит пустоту.
      - name: Проверка запуска
        run: |
          npm run build
          cat > handshake.mjs <<'NODE'
          import { spawn } from 'node:child_process';

          const target = process.argv[2];
          const child = spawn(process.execPath, [target], { stdio: ['pipe', 'pipe', 'inherit'] });
          const replies = new Map();
          let buffer = '';

          child.stdout.on('data', (chunk) => {
            buffer += chunk;
            let cut = buffer.indexOf('\n');
            while (cut >= 0) {
              const line = buffer.slice(0, cut).trim();
              buffer = buffer.slice(cut + 1);
              if (line) {
                const message = JSON.parse(line);
                if (message.id !== undefined) replies.set(message.id, message);
              }
              cut = buffer.indexOf('\n');
            }
          });

          const send = (message) => child.stdin.write(`${JSON.stringify(message)}\n`);

          const wait = async (id) => {
            for (let attempt = 0; attempt < 150; attempt += 1) {
              const reply = replies.get(id);
              if (reply) return reply;
              await new Promise((done) => setTimeout(done, 100));
            }
            throw new Error(`${target}: ответа на запрос ${id} не дождались`);
          };

          send({
            jsonrpc: '2.0',
            id: 1,
            method: 'initialize',
            params: {
              protocolVersion: '2025-06-18',
              capabilities: {},
              clientInfo: { name: 'release-check', version: '0' },
            },
          });
          const hello = await wait(1);
          const server = hello.result?.serverInfo;
          if (!server?.name) {
            throw new Error(`${target}: сервер не представился — ${JSON.stringify(hello)}`);
          }

          send({ jsonrpc: '2.0', method: 'notifications/initialized' });
          send({ jsonrpc: '2.0', id: 2, method: 'tools/list' });
          const listed = await wait(2);
          const tools = listed.result?.tools ?? [];
          if (tools.length === 0) {
            throw new Error(`${target}: инструментов не объявлено ни одного`);
          }

          console.log(`${target}: ${server.name} ${server.version}, инструментов ${tools.length}`);
          child.kill();
          NODE
          for target in dist/index.js plugins/operbots-mcp/dist/index.js; do
            got=$(node "$target" --version)
            if [ "$got" != "${{ steps.version.outputs.value }}" ]; then
              echo "$target сообщает версию $got вместо ${{ steps.version.outputs.value }}" >&2
              exit 1
            fi
            node handshake.mjs "$target"
          done
          rm handshake.mjs

      # Версию могли выложить руками до того, как метка доехала до CI.
      - name: Не опубликована ли уже
        id: check
        run: |
          if npm view "operbots-mcp@${{ steps.version.outputs.value }}" version > /dev/null 2>&1; then
            echo "Версия уже в npm — публикация пропущена."
            echo "published=yes" >> "$GITHUB_OUTPUT"
          else
            echo "published=no" >> "$GITHUB_OUTPUT"
          fi

      # Секрета нет и не нужно: на странице пакета в npm настроен
      # «Trusted Publisher» на этот репозиторий и этот файл, а право
      # публиковать выдаётся по одноразовому удостоверению OIDC. Отсюда же
      # требование id-token: write выше. Переименование файла или перенос
      # его в другой репозиторий разорвёт доверие — тогда настройку на
      # npmjs.com надо поправить под новое имя.
      - name: Публикация в npm
        if: steps.check.outputs.published == 'no'
        run: npm publish --provenance --access public

      - name: Собрать архив для релиза
        run: npm pack

      # Повторный запуск по той же метке не должен падать: релиз уже есть,
      # обновляем в нём архив.
      - name: Релиз GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ./operbots-mcp-${{ steps.version.outputs.value }}.tgz
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              "$ARCHIVE"
          fi

      # Плагин Claude Code ставится из репозитория, а не из npm: без
      # возврата версии он показывал бы номер прошлого выпуска.
      - name: Вернуть версию в main
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          npm version "${{ steps.version.outputs.value }}" --no-git-tag-version --allow-same-version
          # Сравниваем с HEAD, а не с индексом: скрипт version уже
          # добавил часть файлов, и обычный git diff их не покажет.
          if git diff --quiet HEAD -- package.json package-lock.json plugins; then
            echo "В main уже нужная версия."
          else
            git add package.json package-lock.json plugins
            git commit -m "Версия ${{ steps.version.outputs.value }}"
            git push origin HEAD:main
          fi
